<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HY-World-2.0 Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #111827;
            --input-bg: #1f2937;
            --accent: #ff9d00;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border: #374151;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation */
        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel-bg);
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .emoji { font-size: 1.8rem; }
        .title-group h1 { font-size: 1.1rem; margin: 0; }
        .title-group span { font-size: 0.75rem; color: var(--text-secondary); }

        /* Layout Grid */
        main {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Settings */
        .sidebar {
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
        }

        .control-group { margin-bottom: 1.5rem; }
        label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
        label span:last-child { color: var(--accent); }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        select, input[type="number"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }

        /* Content Area */
        .viewport {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            align-items: center;
        }

        .display-window {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .placeholder-text { color: var(--text-secondary); text-align: center; }
        .placeholder-text i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

        /* Input Panel */
        .input-panel {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .prompt-box {
            display: flex;
            gap: 12px;
        }

        textarea {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 60px;
            font-family: inherit;
        }

        .btn-submit {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:active { transform: scale(0.98); }

        .tags {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .tag {
            font-size: 0.7rem;
            background: var(--input-bg);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <span class="emoji">🤗</span>
        <div class="title-group">
            <h1>HY-World-2.0</h1>
            <span>State-of-the-art World Model Generation</span>
        </div>
    </div>
    <div class="header-links">
        <a href="#" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">
            <i class="fa-brands fa-github"></i> Source
        </a>
    </div>
</header>

<main>
    <aside class="sidebar">
        <div class="section-title"><i class="fa-solid fa-sliders"></i> Generation Settings</div>
        
        <div class="control-group">
            <label>Sampling Steps <span>30</span></label>
            <input type="range" min="1" max="100" value="30">
        </div>

        <div class="control-group">
            <label>Guidance Scale <span>7.5</span></label>
            <input type="range" min="1" max="20" step="0.5" value="7.5">
        </div>

        <div class="control-group">
            <label>Aspect Ratio</label>
            <select>
                <option>16:9 (Widescreen)</option>
                <option>9:16 (Vertical)</option>
                <option>1:1 (Square)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Seed</label>
            <input type="number" placeholder="Random">
        </div>

        <button style="width:100%; background:transparent; border:1px solid var(--border); color:white; padding:8px; border-radius:6px; cursor:pointer;">
            Reset to Defaults
        </button>
    </aside>

    <section class="viewport">
        <div class="display-window">
            <div class="placeholder-text">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <p>Output will appear here after generation</p>
            </div>
        </div>

        <div class="input-panel">
            <div class="prompt-box">
                <textarea placeholder="Describe the world you want to generate..."></textarea>
                <button class="btn-submit">
                    <i class="fa-solid fa-play"></i> Run
                </button>
            </div>
            <div class="tags">
                <span class="tag">#Cinematic</span>
                <span class="tag">#4K</span>
                <span class="tag">#HighlyDetailed</span>
            </div>
        </div>
    </section>
</main>

</body>
</html>
